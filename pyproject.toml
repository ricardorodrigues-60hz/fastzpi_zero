[project]
name = "fastzpi-zero"
version = "0.1.0"
description = ""
authors = [
    {name = "ricardo",email = "101021873+ricardorodrigues-60hz@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard] (>=0.138.1,<0.139.0)",
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "tzdata (>=2026.3,<2027.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.20,<0.16.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "typos (>=1.47.2,<2.0.0)",
    "pytest-random-order (>=1.2.0,<2.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings', '--cov=fast_zero', '--cov-context=test', '--cov-branch', '--random-order']
asyncio_default_fixture_loop_scope = 'function'

[tool.taskipy.tasks]
pre_lint = 'typos'
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev fastzpi_zero/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=fastzpi_zero -vv'
post_test = 'coverage html --show-contexts'

